<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c11" />
    <title>card-lab · 输入文字，生成好看的卡片</title>
    <meta
      name="description"
      content="输入一句话，实时生成好看的卡片，一键导出高清 PNG。纯前端，不上传任何数据，手机也能用。"
    />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c6cff'/%3E%3Cpath d='M9 22V10h3.2l3.8 6.4L19.8 10H23v12h-3v-6.7l-3.1 5.2h-1.8L12 15.3V22z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/templates.css" />
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#editor">跳到编辑区</a>

    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__dot" aria-hidden="true"></span>
        <strong>card-lab</strong>
        <span class="topbar__tag">卡片工坊</span>
      </div>
      <p class="topbar__hint">纯前端 · 不上传任何数据 · 手机上直接用</p>
    </header>

    <main class="layout">
      <section class="panel" id="editor" aria-label="编辑区">
        <div class="field">
          <label class="field__label" for="text-input">正文</label>
          <textarea
            id="text-input"
            class="field__input field__input--area"
            rows="3"
            maxlength="2000"
            placeholder="输入你想做成卡片的那句话"
          ></textarea>
          <div class="field__meta">
            <span id="text-count">0 / 2000</span>
            <span class="field__tip">换行会原样保留</span>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="subtext-input">副标题（可留空）</label>
          <input id="subtext-input" class="field__input" type="text" maxlength="120" placeholder="署名、日期、一句话说明" />
        </div>

        <div class="field">
          <span class="field__label" id="template-label">模板</span>
          <div class="picker picker--templates" id="template-picker" role="radiogroup" aria-labelledby="template-label"></div>
        </div>

        <div class="field">
          <span class="field__label" id="theme-label">配色</span>
          <div class="picker picker--swatch" id="theme-picker" role="radiogroup" aria-labelledby="theme-label"></div>
        </div>

        <div class="field">
          <span class="field__label" id="size-label">画布</span>
          <div class="picker picker--sizes" id="size-picker" role="radiogroup" aria-labelledby="size-label"></div>
        </div>

        <div class="field">
          <label class="field__label" for="fontscale-input">
            字号 <output id="fontscale-value" for="fontscale-input">100%</output>
          </label>
          <input id="fontscale-input" class="slider" type="range" min="50" max="200" step="5" value="100" />
        </div>

        <div class="actions">
          <button id="export-btn" class="btn btn--primary" type="button">导出 PNG</button>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="stage" id="preview" aria-label="预览区">
        <div class="stage__stage" id="card-stage">
          <div class="stage__zoom" id="card-zoom">
            <div class="card" id="card" data-template="glass" data-size="square" role="img" aria-label="卡片预览"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>MIT License</span>
      <span>·</span>
      <a href="https://github.com/shk825620-dot/card-lab" rel="noopener">GitHub</a>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
